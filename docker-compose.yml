services:
  Simple-Recipe-Book:
    build:
      context: .
      dockerfile: Dockerfile
    image: nextjs-standalone-image
    container_name: simple-recipe-book
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "4912:3000"
    restart: unless-stopped
    depends_on:
      - SRB-Postgres

  SRB-Postgres:
    image: postgres
    container_name: srb-postgresql
    restart: always
    shm_size: 128mb
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: home-utils-db
